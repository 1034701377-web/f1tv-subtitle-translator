<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>F1 TV 中文字幕 · 声音采集</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <header><div><p class="eyebrow">F1 TV 中文字幕</p><h1>声音采集</h1></div><button id="settings" class="icon-button" type="button" aria-label="设置" title="设置"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9.5 3-.5 2-2 1.2-2-.6-2.5 4.3L4 11.4v2.3l-1.5 1.4 2.5 4.3 2-.6L9 20l.5 2h5l.5-2 2-1.2 2 .6 2.5-4.3-1.5-1.4v-2.3l1.5-1.5L19 5.6l-2 .6L15 5l-.5-2Z"/><circle cx="12" cy="12.5" r="3.2"/></svg></button></header>
  <main>
    <section class="capture-control" aria-label="采集控制">
      <div class="switch-row"><div><h2 id="switch-label">采集此页声音</h2><p id="state" class="state" role="status">读取状态…</p></div><div class="switch-wrap"><span id="switch-value" class="switch-value" aria-hidden="true">OFF</span><button id="capture" class="switch" type="button" role="switch" aria-labelledby="switch-label" aria-describedby="switch-help notice" aria-checked="false" disabled><span></span></button></div></div>
      <p id="switch-help" class="help">默认关闭。采集时此页静音，关闭后恢复声音。</p>
      <p id="notice" class="notice" role="status" hidden></p>
    </section>
    <section class="source" aria-label="采集来源">
      <p id="source-label" class="section-label">当前标签页</p>
      <p id="tab-title" class="tab-title">—</p>
      <dl class="details">
        <div><dt>页面</dt><dd id="page-label">—</dd></div>
        <div><dt>音轨</dt><dd id="audio-label">—</dd></div>
        <div><dt>节目时间</dt><dd id="programme-time">—</dd></div>
      </dl>
    </section>
    <section class="progress" aria-label="本次采集进度">
      <div class="progress-heading"><h2>本次采集</h2><span id="asr-stage">尚未开始</span></div>
      <dl class="pipeline">
        <div><dt><span class="stage-index">01</span> 收到音频</dt><dd id="received">—</dd></div>
        <div><dt><span class="stage-index">02</span> 已送识别</dt><dd id="windows">—</dd></div>
        <div><dt><span class="stage-index">03</span> 已定稿原文</dt><dd id="recognized">—</dd></div>
        <div><dt><span class="stage-index">04</span> 中文缓存</dt><dd id="cues">—</dd></div>
      </dl>
      <p class="level-row"><span>输入电平</span><span id="level">—</span></p>
    </section>
    <p id="config-state" class="configuration">读取配置…</p>
    <p class="footnote">关闭弹窗不会停止采集。字幕显示与样式在网页控制台调整。</p>
    <footer><span>采集由你开启，也由你关闭</span><span id="version"></span></footer>
  </main>
  <script src="popup.js"></script>
</body>
</html>
